name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Syntax check (functions + admin panel)
        run: find functions mednu-admin -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - run: npm --prefix functions ci
      - name: Server logic and unit tests
        run: node functions/test/run_all.js

  rules:
    runs-on: ubuntu-latest
    # Advisory until the rules suite is green on CI; remove this line then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - run: npm --prefix firestore-tests ci
      - run: npm install -g firebase-tools
      - name: Rules tests on the emulators
        run: firebase emulators:exec --only firestore,storage --project mednu-rules-test "npm --prefix firestore-tests test"

  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mednu, mednu_doctor]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ matrix.app }}
      - run: flutter analyze --no-fatal-infos
        working-directory: ${{ matrix.app }}
      - run: flutter test
        working-directory: ${{ matrix.app }}
