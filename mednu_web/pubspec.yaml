name: mednu_web
description: MedNu Patient Web Portal — Premium Healthcare Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  firebase_auth_platform_interface: ^7.0.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0

  # ── State Management ──────────────────────────────────
  flutter_riverpod: ^2.4.9

  # ── Navigation ────────────────────────────────────────
  go_router: ^13.0.1

  # ── UI & Design ───────────────────────────────────────
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  carousel_slider: ^4.2.1
  flutter_rating_bar: ^4.0.1
  qr_flutter: ^4.1.0

  # ── Utilities ─────────────────────────────────────────
  intl: ^0.20.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
