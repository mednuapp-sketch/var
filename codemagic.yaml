workflows:
  mednu-ios:
    name: MedNu (patient) - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mednu
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mednu.mednu
      vars:
        BUNDLE_ID: "com.mednu.mednu"
      groups:
        - appstore_credentials   # define in Codemagic UI: App Store Connect API key
        - firebase_ios_mednu     # define in Codemagic UI: GOOGLE_SERVICE_INFO_PLIST (base64 of GoogleService-Info.plist)
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Restore GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2
          cd ios && pod install

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        integration: appstore_credentials
        submit_to_testflight: true

  mednu-doctor-ios:
    name: MedNu Service (doctor) - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mednu_doctor
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mednu.mednuDoctor
      vars:
        BUNDLE_ID: "com.mednu.mednuDoctor"
      groups:
        - appstore_credentials        # same App Store Connect API key group as above
        - firebase_ios_mednu_doctor   # define in Codemagic UI: GOOGLE_SERVICE_INFO_PLIST (base64 of this app's GoogleService-Info.plist)
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Restore GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2
          cd ios && pod install

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        integration: appstore_credentials
        submit_to_testflight: true
