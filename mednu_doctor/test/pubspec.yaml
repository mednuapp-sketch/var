name: mednu_doctor
description: MedNU Doctor App - Healthcare Professional Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^13.2.5

  # UI
  google_fonts: ^6.3.3
  cached_network_image: ^3.4.0
  smooth_page_indicator: ^1.2.1
  pinput: ^3.0.1
  fl_chart: ^0.66.2
  lottie: ^3.3.3
  shimmer: ^3.0.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  geolocator: ^11.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^5.0.1
  connectivity_plus: ^5.0.2
  dio: ^5.9.2
  uuid: ^4.5.3
  agora_rtc_engine: ^6.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
