name: mednu_doctor
description: MedNU Doctor App - Healthcare Professional Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+7
  firebase_crashlytics: ^4.1.3

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^13.2.5

  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.3.3
  cached_network_image: ^3.4.0
  smooth_page_indicator: ^1.2.1
  pinput: ^3.0.1
  fl_chart: ^0.66.2
  lottie: ^3.3.3
  shimmer: ^3.0.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  geolocator: ^11.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  connectivity_plus: ^5.0.2
  dio: ^5.9.2
  uuid: ^4.5.3
  agora_rtc_engine: ^6.5.3
  flutter_contacts: ^1.1.7+1
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.0.0
  flutter_ringtone_player: ^4.0.0
  wakelock_plus: ^1.2.8
  file_picker: ^8.0.7
  flutter_foreground_task: ^8.0.1
  timezone: ^0.9.4
  screen_protector: ^1.5.2          # prevent screenshot/recording during video calls

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/