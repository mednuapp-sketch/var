name: mednu
description: MedNU - Your Family Healthcare Partner by MedNU Healthcare Services Private Limited
publish_to: 'none'
version: 1.0.3+9

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.3.0
  firebase_app_check: ^0.3.1+7
  firebase_crashlytics: ^4.1.3

  cupertino_icons: ^1.0.8

  # ── Auth ──────────────────────────────────────────────
  google_sign_in: ^6.2.1
  pinput: ^3.0.1

  # ── State Management ──────────────────────────────────
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # ── Navigation ────────────────────────────────────────
  go_router: ^14.8.1
  app_links: ^6.3.3                 # mednu:// deep link — guest call join

  # ── UI & Design ───────────────────────────────────────
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  fl_chart: ^0.66.2
  timeline_tile: ^2.0.0
  badges: ^3.1.2
  animated_bottom_navigation_bar: ^1.3.1
  flutter_rating_bar: ^4.0.1
  percent_indicator: ^4.2.3

  # ── Maps & Location ───────────────────────────────────
  google_maps_flutter: ^2.5.3
  google_maps_flutter_android: ^2.19.8
  google_maps_flutter_platform_interface: ^2.15.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # ── Notifications ─────────────────────────────────────
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^3.0.0
  timezone: ^0.9.2
  workmanager: ^0.9.0+3             # background tasks (water reminders, period tracker)
  flutter_ringtone_player: ^4.0.0   # incoming call ringtone for patient
  wakelock_plus: ^1.2.8             # keep screen on during incoming calls

  # ── Media & Files ─────────────────────────────────────
  image_picker: ^1.0.7
  file_picker: ^11.0.2
  flutter_pdfview: ^1.3.2
  flutter_image_compress: ^2.3.0
  agora_rtc_engine: ^6.5.3
  pdf: ^3.11.0
  path_provider: ^2.1.2
  # ── Payments & Wallet ─────────────────────────────────
  razorpay_flutter: ^1.3.6        # Indian payment gateway
  cloud_functions: ^5.6.2         # Firebase callable functions (order creation, payment verification)

  # ── Cryptography ──────────────────────────────────────
  crypto: ^3.0.3

  # ── Security ──────────────────────────────────────────
  screen_protector: ^1.5.2          # prevent screenshot/recording during video calls

  # ── Utilities ─────────────────────────────────────────
  intl: ^0.20.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.2
  dio: ^5.4.0                     # HTTP client
  pretty_dio_logger: ^1.3.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  collection: ^1.18.0
  dartz: ^0.10.1                  # functional programming
  get_it: ^7.6.7                  # dependency injection
  injectable: ^2.3.2
  permission_handler: ^11.2.0
  flutter_contacts: ^1.1.9+1       # read phone contacts
  package_info_plus: ^9.0.1
  url_launcher: ^6.2.4
  share_plus: ^7.2.1
  qr_flutter: ^4.1.0              # QR for prescriptions
  health: ^12.1.0                 # health data (steps, heart rate)
  local_auth: ^2.1.8              # biometric auth

  # ── Internationalisation ──────────────────────────────
  easy_localization: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

# ── App Icon & Splash ──────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/mednu_icon_flat.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#522546"
  adaptive_icon_foreground: "assets/images/mednu_icon_foreground.png"

flutter_native_splash:
  color: "#522546"
  image: assets/images/mednu_splash.png
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  generate: true                  # enables l10n generation

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/
