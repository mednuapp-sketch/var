org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Capped after the release build's Gradle daemon repeatedly crashed with a
# native-memory OOM on this machine (15GB RAM) — parallel workers (esp. R8
# minification) each hold significant memory at once; limiting concurrency
# lowers peak usage at some cost to build speed.
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
